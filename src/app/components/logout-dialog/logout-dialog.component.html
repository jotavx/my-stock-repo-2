<h1 mat-dialog-title>Cerrar Sesión</h1>
<div mat-dialog-content>
  ¿Deseas cerrar sesión?</div>
<div mat-dialog-actions align="end">
  <button mat-raised-button color="accent" mat-dialog-close>Cancelar</button>
  <button mat-raised-button color="warn" mat-dialog-close (click)="onClick()">Confirmar</button>
</div>
