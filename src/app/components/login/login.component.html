<div class=" max-w-xs mx-auto">
  <div class="container rounded bg-white  ">
    <form class="shadow-md rounded px-8 pt-6 pb-8 mb-4" [formGroup]="formLogin">
      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-bold mb-2 " for="username">
          Email
        </label>
        <input
          class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
          formControlName="email" type="email" required>
      </div>
      <div class="mb-6">
        <label class="block text-gray-700 text-sm font-bold mb-2 " for="password">
          Contraseña
        </label>
        <input
          class="shadow appearance-none  w-full py-2 px-3 text-gray-700 mb-3 leading-tight focus:outline-none focus:shadow-outline"
          type="password" id="password" name="password" required placeholder="******************"
          formControlName="password">
        <p *ngIf="loginError" class="text-red-500 text-xs ">Usuario o contraseña incorrecto</p>
      </div>
      <div align="end">
        <!-- <a class="inline-block align-baseline text-sm text-blue-500 hover:text-blue-800">
          Olvidaste tu contraseña?
        </a> -->
        <button mat-raised-button color="primary" type="submit" (click)="onSubmit()"
          class="btn btn-primary mt-3 text-white">Iniciar
          Sesión</button>
      </div>

    </form>
  </div>
  <br><br>
  <p class="text-center text-gray-500 text-xs">
    &copy;2024 App Products.
  </p>
</div>
