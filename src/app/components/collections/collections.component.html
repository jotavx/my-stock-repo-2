<div class="container bg-white ">
  <div class="header">
    <h1 class="text-gray-950 ">Colecciones</h1>
  </div>
</div>

<section class="text-gray-600 body-font">
  <div class="container px-5 py-24 mx-auto">
    <!-- Campo de búsqueda y botón -->
    <div class="flex items-center space-x-2 mb-4">
      <input type="text" placeholder="Buscar colecciones..." [formControl]="searchControl"
        class="block w-full p-4 ps-10 text-sm text-gray-900 border border-gray-300 rounded-lg bg-gray-50 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-100 dark:placeholder-gray-600 dark:text-black dark:focus:ring-blue-500 dark:focus:border-blue-500 focus:outline-none" />
    </div>

    <!-- Skeleton Loader -->
    <div *ngIf="loading" class="flex flex-wrap">
      <div *ngFor="let _ of skeletonArray" class="flex flex-col m-8 rounded shadow-md w-60 sm:w-80 animate-pulse h-96">
        <div class="h-48 rounded-t dark:bg-gray-300"></div>
        <div class="flex-1 px-4 py-8 space-y-4 sm:p-8 dark:bg-gray-50">
          <div class="w-full h-6 rounded dark:bg-gray-300"></div>
          <div class="w-full h-6 rounded dark:bg-gray-300"></div>
          <div class="w-3/4 h-6 rounded dark:bg-gray-300"></div>
        </div>
      </div>
    </div>

    <!-- Colecciones -->
    <div *ngIf="!loading" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8 mt-5">
      <div *ngFor="let coleccion of productosAgrupadosFiltrados"
        class="max-w-sm rounded overflow-hidden shadow-lg bg-white ">
        <img class="w-full h-48 object-cover not-image" [src]="coleccion.imagen">
        <div class="px-6 py-4">
          <div class="ms-1 font-bold text-xl mb-2 uppercase text-gray-700 ">{{coleccion.nombre}}</div>
          <div class="ms-1 font-bold text-sm mb-2 uppercase text-gray-700 ">
            {{coleccion.categoria}}</div>
          <!-- <span
            class="inline-block bg-blue-200 rounded-full px-3 py-1 text-sm font-semibold text-gray-700  mb-2 uppercase  ">
            STOCK: <span class="text-gray-700 font-bold uppercase ">{{coleccion.totalCantidad}}</span>
          </span> -->
          <span class="flex items-center me-2">Stock Total:
            <span matTooltip="Cantidad"
              class="flex items-center justify-center h-7 w-7 rounded-full bg-blue-900 text-white text-xs font-bold text-white font-bold uppercase ms-1 cursor-pointer   "
              [ngClass]="{
                        'bg-red-500 ': coleccion.totalCantidad === 0,
                        'bg-orange-600 ': coleccion.totalCantidad > 0 && coleccion.totalCantidad <= 5
                      }">{{
              coleccion.totalCantidad
              }}</span></span>
        </div>
        <div class="px-6 pt-4 pb-2 flex justify-evenly">

          <span class="inline-block px-3 py-1 text-sm font-semibold text-gray-600 cursor-pointer "
            (click)="explorarColeccion(coleccion.productos)">
            Explorar colección<i class="ms-2 fa-solid fa-right-long "></i>
          </span>
        </div>
      </div>
    </div>
  </div>
  <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
</section>
