<h1 mat-dialog-title>Confirmación</h1>
<div mat-dialog-content>
  <p>¿Estás seguro de realizar la acción?</p>
</div>
<div mat-dialog-actions align="end">
  <button mat-raised-button color="accent" (click)="onCancel()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="onConfirm()">Confirmar</button>
</div>
